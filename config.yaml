# freeway configuration.
# API keys and ROUTER_TOKEN live in .env (see .env.example), never here.

host: 127.0.0.1
port: 4100
refresh_minutes: 30        # how often provider model lists are re-read
first_token_timeout: 30    # seconds to wait for the first streamed chunk before trying the next provider
max_attempts: 8            # endpoints tried per request before giving up

# Where model scores come from: the Artificial Analysis Intelligence Index
# (free API key, https://artificialanalysis.ai). The index runs from 0 to about
# 65 for the best model in the world; most free models sit between 3 and 30.
# A model the benchmark does not know is "unrated": no tier will pick it, but
# you can still call it by name or rate it under `models:` below.
scores:
  api_key_env: ARTIFICIAL_ANALYSIS_API_KEY
  refresh_hours: 24
  cache_file: data/scores.json

# Intelligence tiers over that index. Calling model="smart" tries the best
# models in that tier first, then falls through `fallback`. The tiers are
# relative to what is free: the best free model scores about 29 while the best
# paid ones reach 65, so "smart" here means "best of the free ones". Revisit the
# thresholds as models come and go and as the index version changes.
tiers:
  - { name: smart,    min_score: 20, fallback: [balanced, fast] }
  - { name: balanced, min_score: 10, fallback: [fast] }
  - { name: fast,     min_score: 0,  fallback: [] }

providers:
  - name: openrouter
    kind: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    priority: 20
    exclude: ["openrouter/free"]   # meta-router: the real model is unknown

  - name: opencode
    kind: opencode
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_API_KEY
    priority: 10

  - name: google
    kind: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY    # key from aistudio.google.com
    priority: 10
    # The listing has 60+ entries. Excluded, as tested against a free-tier key:
    #  not chat: image, video, audio, music, live, embeddings, transcribe, agents (Interactions API only)
    #  no free quota (429 "free_tier ... limit: 0"): every Pro, omni, gemini-4-*
    #  closed to new users (404): gemini-2.5-*
    #  *-latest are aliases of models already listed
    exclude:
      - "*imagen*"
      - "*veo*"
      - "*image*"
      - "*audio*"
      - "*live*"
      - "*aqa*"
      - "*robotics*"
      - "*computer-use*"
      - "*transcribe*"
      - "*antigravity*"
      - "*deep-research*"
      - "*decision*"
      - "*lyria*"
      - "*nano-banana*"
      - "*-pro*"
      - "*omni*"
      - "gemini-4-*"
      - "gemini-2.5-*"
      - "*-latest"


# Names that must be treated as one model when automatic matching misses them.
aliases: {}
#  deepseek-v4.1-flash: [deepseek-chat-flash]

# Your own ratings win over the benchmark. `score` is on the same index scale
# and recomputes the tier; `tier` forces it. Keys are any spelling the catalog
# knows (see GET /v1/models; GET /admin/status lists the unrated ones).
models:
  inkling-2-small: { disabled: true }   # 403 "not available in your country" on every provider

  # ESTIMATES, not measured: Artificial Analysis does not publish these in its
  # free tier. Placed just under gemini-3.8-flash (22.5, measured), newest first.
  gemini-3.7-flash:       { score: 21 }
  gemini-3.6-flash:       { score: 20 }
  gemini-3.5-flash:       { score: 18 }
  gemini-3-flash-preview: { score: 16 }
  gemini-3.1-flash-lite:  { score: 6.2 }   # same as gemini-3.1-flash-lite-preview, measured
#  big-pickle: { score: 25 }
#  gemma-4-31b-it: { tier: balanced }
#  some-bad-model: { disabled: true }

exclude: []   # globs on canonical model names
